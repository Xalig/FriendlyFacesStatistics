:root{
  --nar:#A3122F; --saffron:#F5A300; --caspian:#0B5C6B; --fig:#43194A; --pist:#BFD46A; --night:#15122E;
  --milk:#FFF4DC; --ink:#1B0F20;
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --text:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);overscroll-behavior:none}
body{font-family:var(--text);color:var(--milk);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg);color:var(--fg);transition:background .25s}
.c-nar{--bg:var(--nar);--fg:var(--milk);--acc:var(--saffron);--soft:rgba(255,244,220,.16)}
.c-saf{--bg:var(--saffron);--fg:var(--ink);--acc:var(--nar);--soft:rgba(27,15,32,.12)}
.c-cas{--bg:var(--caspian);--fg:var(--milk);--acc:var(--pist);--soft:rgba(255,244,220,.15)}
.c-fig{--bg:var(--fig);--fg:var(--milk);--acc:var(--saffron);--soft:rgba(255,244,220,.14)}
.c-pis{--bg:var(--pist);--fg:var(--ink);--acc:var(--fig);--soft:rgba(27,15,32,.12)}
.c-ngt{--bg:var(--night);--fg:var(--milk);--acc:var(--saffron);--soft:rgba(255,244,220,.13)}

/* ---------- каркас сторис ---------- */
.bars{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:3px;z-index:5}
.bars i{flex:1;height:3px;border-radius:2px;background:var(--soft)}
.bars i.on{background:var(--fg)}
.close{position:absolute;top:22px;right:8px;z-index:6;width:44px;height:44px;font-size:26px;line-height:1;opacity:.75}
.who{position:absolute;top:30px;left:16px;right:60px;z-index:5;font-size:13px;font-weight:600;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide{position:absolute;inset:0;padding:68px 22px 54px;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow-y:auto}
.tap{position:absolute;top:70px;bottom:0;z-index:4}
.tap.l{left:0;width:30%}.tap.r{right:0;width:70%}
.hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:13px;opacity:.6;z-index:3;pointer-events:none}
:focus-visible{outline:3px solid var(--acc,#F5A300);outline-offset:2px}

/* ---------- типографика ---------- */
h1,h2,.big,.huge,.word{font-family:var(--display);font-weight:400;line-height:1.02;letter-spacing:-.01em;overflow-wrap:anywhere}
.lead{font-size:19px;font-weight:600;line-height:1.3}
.huge{font-size:clamp(56px,21vw,104px);color:var(--acc)}
.huge.sm{font-size:clamp(40px,14vw,68px)}
.huge.h5{font-size:clamp(46px,16.5vw,80px)}
.huge.h6{font-size:clamp(38px,13.4vw,64px)}
.big{font-size:clamp(30px,9.5vw,44px)}
.mid{font-family:var(--display);font-size:clamp(21px,6.4vw,28px);line-height:1.12;overflow-wrap:anywhere}
.note{font-size:15px;opacity:.82}
.roast{font-weight:600;font-size:16.5px;line-height:1.32;border-left:4px solid var(--acc);padding-left:12px}
.acc{color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 40%;background:var(--soft);border-radius:14px;padding:11px 13px;min-width:0}
.stat b.nm{font-family:var(--text);font-weight:800;font-size:17px;line-height:1.2;margin-bottom:3px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.stat span{font-size:13.5px;opacity:.85}
.list{display:flex;flex-direction:column;gap:7px}
.li{display:flex;align-items:baseline;gap:10px;background:var(--soft);border-radius:12px;padding:9px 12px}
.li .n{font-family:var(--display);font-size:15px;color:var(--acc);flex:none;min-width:22px}
.li .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .v{flex:none;font-size:14px;opacity:.8}
.li.col{flex-direction:column;gap:1px;align-items:stretch}
.li.col .t{white-space:normal}
.li.col .v{font-size:13.5px}
.quote{background:var(--fg);color:var(--bg);border-radius:18px 18px 18px 4px;padding:13px 15px;font-weight:600;font-size:17px;line-height:1.3;overflow-wrap:anywhere;max-height:9.2em;overflow:hidden}
.quote small{display:block;margin-top:6px;font-weight:400;font-size:13px;opacity:.75}
.word{display:block;color:var(--fg)}
.words .word:nth-child(1){font-size:clamp(40px,13vw,60px);color:var(--acc)}
.words .word:nth-child(2){font-size:clamp(32px,10.5vw,48px)}
.words .word:nth-child(3){font-size:clamp(26px,8.5vw,38px);opacity:.92}
.words .word:nth-child(4){font-size:clamp(22px,7vw,30px);opacity:.84}
.words .word:nth-child(5){font-size:clamp(19px,6vw,25px);opacity:.76}
.emo{font-size:38px;letter-spacing:6px;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:600}
.chip.top{background:var(--acc);color:var(--bg)}

/* ---------- графики ---------- */
.chart{display:flex;align-items:flex-end;gap:3px;height:120px}
.chart i{flex:1;background:var(--fg);opacity:.32;border-radius:3px 3px 0 0;min-height:2px}
.chart i.pk{background:var(--acc);opacity:1}
.axis{display:flex;justify-content:space-between;font-size:12px;opacity:.7;margin-top:-8px}

/* ---------- старт и выбор ---------- */
.home{position:absolute;inset:0;padding:34px 22px 26px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.home h1{font-size:clamp(42px,14.5vw,66px);color:var(--milk)}
.home h1 span{display:block;color:var(--saffron)}
.faces{display:flex;gap:6px;margin:2px 0 4px}
.faces svg{width:21%;height:auto;flex:none}
.faces svg:nth-child(2){transform:translateY(10px) rotate(-6deg)}
.faces svg:nth-child(3){transform:rotate(5deg)}
.faces svg:nth-child(4){transform:translateY(8px) rotate(-3deg)}
.btn{display:block;width:100%;padding:16px 18px;border-radius:16px;font-weight:800;font-size:18px;text-align:center;background:var(--saffron);color:var(--ink)}
.btn.alt{background:rgba(255,244,220,.14);color:var(--milk)}
.btn.sm{padding:12px 14px;font-size:16px}
.spacer{flex:1}
.pick{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px 16px 0;gap:12px}
.pick input{width:100%;padding:14px 16px;border-radius:14px;border:0;font:inherit;font-size:17px;background:var(--milk);color:var(--ink)}
.pick .scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:20px}
.pick .p{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,244,220,.1);border-radius:14px;padding:8px 12px;width:100%}
.pick .p svg{width:38px;height:38px;flex:none}
.pick .p b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pick .p span{font-size:13px;opacity:.7;flex:none}
.pick .back{align-self:flex-start;font-weight:600;opacity:.8;padding:6px 2px}

/* ---------- финальная карточка ---------- */
.card{background:var(--milk);color:var(--ink);border-radius:26px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.card .top{display:flex;gap:14px;align-items:center}
.card .top>div{min-width:0}
.card .top svg{width:88px;height:88px;flex:none}
.card .nm{font-weight:800;font-size:17px;overflow-wrap:anywhere;line-height:1.2}
.card .ttl{font-family:var(--display);font-size:clamp(18px,5.5vw,23px);line-height:1.08;color:var(--nar);overflow-wrap:break-word}
.card .desc{font-size:14.5px;opacity:.8}
.card .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card .grid div{background:rgba(27,15,32,.07);border-radius:11px;padding:7px 10px;font-size:13px;line-height:1.25}
.card .grid b{display:block;font-family:var(--display);font-weight:400;font-size:18px}
.card .chip{background:rgba(27,15,32,.08)}
.card .chip.top{background:var(--nar);color:var(--milk)}
.card .foot{font-size:12px;opacity:.6;display:flex;justify-content:space-between}
.actions{display:flex;gap:8px;position:relative;z-index:6}
.actions .btn{flex:1}
@media (max-height:640px){.slide{gap:10px;padding-top:60px}.chart{height:90px}.huge{font-size:clamp(48px,17vw,84px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  var ir = p.iris, law = [];

  if(ir.warn+ir.mute+ir.kicked) law.push(['🚨', 'Тебе прилетело: '+[[ir.warn,'варнов'],[ir.mute,'мутов'],[ir.kicked,'киков']].filter(function(x){return x[0];}).map(function(x){return x[1]+' '+x[0];}).join(', ')+'. '+pk(p,'l2',['Заслуженно.','Было за что, мы читали.','Ирис всё помнит.'])]);

  if(p.kill>=2) law.push(['🪦', cnt(p.kill,W.time)+' после твоего сообщения чат молчал три часа. '+pk(p,'l5',['Совпадение? Не думаем.','Талант убивать беседы.','Чат просто ушёл подумать о жизни.'])]);

  }
  if(ir.farm) law.push(['🌾', 'На ферме добыто '+fmt(ir.farm)+' i¢ за '+cnt(ir.farmN,W.time)+'. '+pk(p,'l9',['На хлеб не хватит.','Фермер года, только урожай виртуальный.','Колхоз «Ирис» гордится.'])]);
  if(law.length>=2){
    S.push({c:'c-ngt', h:'<p class="lead">Власть, порядок и прочие достижения</p><div class="list">'+law.slice(0,6).map(function(l){ return '<div class="li"><span class="n">'+l[0]+'</span><span class="t" style="white-space:normal;font-weight:400">'+esc(l[1])+'</span></div>'; }).join('')+'</div>'});

    (chips?'<div class="chips">'+chips+'</div>':'')+
    '<div class="grid"><div><b>'+fmt(n)+'</b>'+pl(n,W.msg)+', '+R+' в чате</div><div><b>'+hh(p.peakHour)+'</b>час пик, ночью '+p.nightPct+'%</div>'+

    '<p class="note" style="text-align:center">'+pk(p,'cta',['Сделай скриншот и кинь в чат. Пусть знают.','Скриншот в чат — и пусть оправдываются.','Скринь и кидай в чат. Позор должен быть публичным.'])+'</p>'+
    '<div class="actions"><button class="btn sm" data-act="share">Поделиться</button><button class="btn sm alt" data-act="chat">Итоги чата</button></div>'+
    '<div class="actions"><button class="btn sm alt" data-act="pick">Посмотреть другого</button></div>'});
  return S;
}

      roast(dn(c.ff.top[0][0])+' — '+fmt(c.ff.top[0][1]+c.ff.top[0][2])+' сообщений на два чата. Это не общительность, это полная занятость.')});
  }
  S.push({c:'c-nar', h:'<p class="lead">Власть и порядок</p><div class="row">'+
    '<div class="stat"><b>'+fmt(sv.joined||0)+'</b><span>человек зашли по ссылке</span></div><div class="stat"><b>'+fmt(ir.kick||0)+'</b><span>исключены</span></div>'+
    '<div class="stat"><b>'+fmt(ir.warn||0)+'</b><span>варнов выдано</span></div><div class="stat"><b>'+fmt(ir.mute||0)+'</b><span>мутов</span></div>'+
    '<div class="stat"><b>'+fmt(ir.promo||0)+'</b><span>раз выдавали админку</span></div><div class="stat"><b>'+fmt(ir.demo||0)+'</b><span>раз её отбирали</span></div></div>'+
    roast('Высшая должность в чате — «Отец-основатель», следующая — «Каблук». Карьерная лестница как она есть.')+
    '<p class="note">Ещё: '+fmt(ir.resp||0)+' раз оказано уважение, '+fmt(ir.farm||0)+' i¢ добыто на ферме, '+fmt(sv.pins||0)+' закрепов.</p>'});
  var cols = ['c-saf','c-cas','c-fig'];
  for(var i=0;i<c.noms.length;i+=5){
    S.push({c:cols[(i/5)%3], h:'<p class="lead">Номинации года'+(i?', продолжение':'')+'</p><div class="list">'+c.noms.slice(i,i+5).map(function(nm){
      return '<div class="li col"><span class="t">'+nm.icon+' '+esc(nm.title)+': <span class="acc">'+dn(nm.name)+'</span></span><span class="v">'+esc(nm.val)+'</span></div>'; }).join('')+'</div>'});
  }
  for(var j=0;j<c.topReact.length;j+=3){
    S.push({c:j?'c-cas':'c-pis', h:'<p class="lead">'+(j?'Золотой фонд, продолжение':'Золотой фонд: больше всего реакций')+'</p><div class="list">'+c.topReact.slice(j,j+3).map(function(t){ return quote(t, t.name); }).join('')+'</div>'+
      (j?'':roast('Из '+fmt(c.total)+' сообщений чат выбрал вот это. Вопросы к чату.'))});
  }
  if(c.ny && c.ny.first){
    S.push({c:'c-ngt', h:'<p class="lead">Новый год встретили в чате</p><div class="huge sm">'+fmt(c.ny.night)+'</div><p class="mid">'+pl(c.ny.night,W.msg)+' за новогоднюю ночь</p>'+
      '<p class="note">Первое сообщение '+(c.ny.year||2026)+' года, '+esc(c.ny.first.time)+'</p><div class="quote">'+esc(c.ny.first.text)+'<small>'+dn(c.ny.first.name)+'</small></div>'+
      roast('С семьёй, видимо, посидеть не получилось.')});
  }
  S.push({c:'c-fig', final:true, h:'<h2 class="big">Спасибо, что не спите.</h2><p class="lead">До встречи в следующем семестре. И сходите уже кто-нибудь на первую пару.</p>'+
    '<div class="actions"><button class="btn sm" data-act="mine">Мои итоги</button><button class="btn sm alt" data-act="pick">Выбрать человека</button></div>'});
  return S;
}

// ---------- экраны ----------
var cur = null;  // {slides, i, label}
function haptic(){ try{ if(tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }catch(e){} }
function home(){
  cur = null; app.className = 'c-ngt';
  var sample = PEOPLE.slice(0,4).map(face).join('');
  app.innerHTML = '<div class="home"><div class="faces">'+sample+'</div><h1>Azii Rus<span>итоги 25/26</span></h1>'+
    '<p class="lead">'+fmt(CH.total)+' '+pl(CH.total,W.msg)+', '+CH.senders+' человек и подозрительно мало разговоров об учёбе.</p>'+
    '<p class="note">сентябрь 2025 — ноябрь 2026</p><div class="spacer"></div>'+
    (me ? '<button class="btn" data-act="mine">Смотреть итоги: '+esc(me.display||me.name)+'</button><button class="btn alt" data-act="pick">Это не я — выбрать себя</button>'
        : '<button class="btn" data-act="pick">Найти себя в списке</button>')+
    '<button class="btn alt" data-act="chat">Итоги всего чата</button></div>';
}
function picker(){
  cur = null; app.className = 'c-ngt';
  app.innerHTML = '<div class="pick"><button class="back" data-act="home">‹ Назад</button><input type="search" placeholder="Ник или имя" aria-label="Поиск по нику">'+
    '<div class="scroll"></div></div>';
  var box = app.querySelector('.scroll'), inp = app.querySelector('input');
  function draw(){
    var q = norm(inp.value), out = [], k = 0;
    for(var i=0;i<PEOPLE.length && k<60;i++){
      var p = PEOPLE[i], hay = norm([p.name, p.display||''].concat(p.aliases||[]).join(' '));
      if(q && hay.indexOf(q)<0) continue; k++;
      out.push('<button class="p" data-name="'+esc(p.name)+'">'+face(p)+'<b>'+esc(p.display||p.name)+'</b><span>'+fmt(p.n)+'</span></button>');
    }
    box.innerHTML = out.join('') || '<p class="note">Никого не нашлось. В список попали те, кто написал хотя бы 30 сообщений.</p>';
  }
  inp.addEventListener('input', draw); draw();
}
function play(slides, label){ cur = {slides:slides, i:0, label:label}; render(); }
function render(){
  var s = cur.slides[cur.i];
  app.className = s.c;
  app.innerHTML = '<div class="bars">'+cur.slides.map(function(_,i){ return '<i'+(i<=cur.i?' class="on"':'')+'></i>'; }).join('')+'</div>'+
    '<div class="who">'+esc(cur.label)+'</div><button class="close" data-act="home" aria-label="Закрыть">×</button>'+
    '<div class="slide">'+s.h+'</div>'+
    (s.final?'':'<button class="tap l" data-act="prev" aria-label="Назад"></button><button class="tap r" data-act="next" aria-label="Дальше"></button>')+
    (cur.i===0?'<div class="hint">Нажимай справа, чтобы листать</div>':'')+
    (s.final?'<button class="tap l" data-act="prev" aria-label="Назад" style="top:70px;bottom:auto;height:40px;width:100%"></button>':'');
}
function go(d){ if(!cur) return; var j = cur.i + d; if(j<0 || j>=cur.slides.length) return; cur.i = j; haptic(); render(); }
function share(){
  var p = me; if(!p) return;
  var text = 'Мои итоги в Azii Rus: '+p.title.icon+' '+p.title.name+'. '+cnt(p.n,W.msg)+', #'+p.rank+' в чате, час пик '+hh(p.peakHour)+'. А у тебя?';
  var url = 'https://t.me/share/url?url='+encodeURIComponent(APP_LINK || location.href.split('#')[0])+'&text='+encodeURIComponent(text);
  try{ if(tg && tg.openTelegramLink){ tg.openTelegramLink(url); return; } }catch(e){}
  var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act],[data-name]'); if(!el) return;
  if(el.dataset.name){ me = BY[el.dataset.name]; store('ff_me', me.name); play(personSlides(me), me.display||me.name); return; }
  var a = el.dataset.act;
  if(a==='next') go(1); else if(a==='prev') go(-1); else if(a==='home') home(); else if(a==='pick') picker();
  else if(a==='chat') play(chatSlides(), 'Итоги чата'); else if(a==='mine'){ if(me) play(personSlides(me), me.display||me.name); else picker(); }
  else if(a==='share') share();
});
document.addEventListener('keydown', function(ev){ if(ev.key==='ArrowRight') go(1); else if(ev.key==='ArrowLeft') go(-1); else if(ev.key==='Escape' && cur) home(); });
// для отладки и прямых ссылок: #chat или #p-<номер в рейтинге>
var hs = location.hash.replace('#','');
if(hs==='chat') play(chatSlides(),'Итоги чата');
else if(/^p-\d+$/.test(hs) && PEOPLE[+hs.slice(2)-1]){ me = PEOPLE[+hs.slice(2)-1]; play(personSlides(me), me.display||me.name); }
else home();
window.__ff = {roasts:function(i){ return personSlides(PEOPLE[i]).map(function(sl){ var m=sl.h.match(/<p class="roast">(.*?)<\/p>/); return m?m[1]:null; }).filter(Boolean); }, go:go, at:function(i){ if(cur){ cur.i=i; render(); } }, count:function(){ return cur?cur.slides.length:0; }};
})();
</script>
</body>
</html>
